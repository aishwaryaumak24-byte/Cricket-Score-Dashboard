server.port=8080

# H2 In-Memory Database configuration
spring.datasource.url=jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Web Console for inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Application Custom Configurations
cricket.simulation.default-speed-ms=2500
cricket.simulation.auto-start-demo=true

# Logging
logging.level.com.cricketscore=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
